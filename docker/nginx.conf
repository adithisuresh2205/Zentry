# ─────────────────────────────────────────────────────────────────────────────
# SentinelGate — Nginx Configuration (Production)
# Handles:
#   - TLS termination (HTTPS)
#   - HTTP → HTTPS redirect
#   - Reverse proxy to backend (FastAPI) and frontend (Next.js)
#   - WebSocket upgrade for /ws/*
#   - Health endpoint restricted to localhost
#   - Security headers (defence-in-depth, complements gateway headers)
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # ── Security: Hide version ─────────────────────────────────────────────────
    server_tokens off;

    # ── Rate limiting zones (edge-level, before reaching gateway) ─────────────
    limit_req_zone $binary_remote_addr zone=global:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=15r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream definitions ───────────────────────────────────────────────────
    upstream gateway_backend {
        server gateway:8000;
        keepalive 32;
    }

    upstream frontend_server {
        server frontend:3000;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow health check from Docker network
        location /health {
            allow 127.0.0.1;
            allow 172.16.0.0/12;   # Docker internal networks
            deny all;
            proxy_pass http://gateway_backend;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;
        http2 on;

        # ── TLS certificates ──────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/sentinelgate.crt;
        ssl_certificate_key /etc/nginx/ssl/sentinelgate.key;

        # ── TLS hardening ─────────────────────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── Security headers (Nginx layer) ────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Request limits ────────────────────────────────────────────────────
        client_max_body_size 2M;
        client_body_timeout 30s;
        client_header_timeout 30s;
        limit_conn conn_limit 20;

        # ── Health check — INTERNAL ONLY ──────────────────────────────────────
        location = /health {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://gateway_backend;
            proxy_set_header Host $host;
        }

        # ── Auth endpoints — stricter rate limit ──────────────────────────────
        location ~* ^/auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://gateway_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── WebSocket endpoint ────────────────────────────────────────────────
        location /ws/ {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── API / Backend ─────────────────────────────────────────────────────
        location ~* ^/(api|security|auth)/ {
            limit_req zone=global burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://gateway_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Frontend (Next.js) ────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend_server;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Static assets (Next.js) ───────────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend_server;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
