# Alembic Configuration File — SentinelGate
# This file is read by `alembic` commands.
# All environment-specific settings are loaded from .env via env.py.

[alembic]
# Path to migrations directory (relative to this file)
script_location = backend/alembic

# Template used to generate migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for --autogenerate timestamps
timezone = UTC

# Max length of the "slug" portion of migration filenames
truncate_slug_length = 40

# Version table name in the database
version_table = alembic_version

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
