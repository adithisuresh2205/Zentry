# ─────────────────────────────────────────────────────────────────────────────
# SentinelGate — Pre-commit Hooks
# Run: pre-commit install   (once, after cloning)
# Run: pre-commit run --all-files   (manual check)
# ─────────────────────────────────────────────────────────────────────────────
repos:

  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: detect-private-key          # Catches accidentally committed private keys
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Secret detection ───────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ".env.example"

  # ── Python: Ruff (lint + format) ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── Python: Mypy ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^backend/
        args: ["--ignore-missing-imports"]
        additional_dependencies:
          - pydantic>=2.7.0
          - pydantic-settings>=2.3.0
          - types-python-dateutil
          - types-passlib

  # ── JavaScript/TypeScript: Prettier ───────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.0
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, css, json, markdown]

  # ── Docker ────────────────────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0-beta
    hooks:
      - id: hadolint-docker
        files: ".*\\.Dockerfile$"
