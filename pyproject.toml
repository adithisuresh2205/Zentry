[project]
name = "sentinelgate"
version = "0.1.0"
description = "Zero-Trust Web Application Security Gateway"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SentinelGate Team" }]

dependencies = [
    # ── Web framework ──────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",

    # ── Auth ──────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # ── Database ──────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",          # PostgreSQL async driver
    "aiosqlite>=0.20.0",        # SQLite async driver (for testing)
    "alembic>=1.13.0",

    # ── Redis ─────────────────────────────────────────────
    "redis[asyncio]>=5.0.0",

    # ── Configuration ─────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # ── Utilities ─────────────────────────────────────────
    "structlog>=24.1.0",        # structured logging
    "orjson>=3.10.0",           # fast JSON serialization
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    # ── Testing ───────────────────────────────────────────
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "anyio[trio]>=4.4.0",
    "httpx>=0.27.0",             # async test client
    "fakeredis[aioredis]>=2.23.0",  # in-memory Redis for tests

    # ── Linting & formatting ───────────────────────────────
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
    "types-passlib>=1.7.7",

    # ── Pre-commit ────────────────────────────────────────
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ── Ruff (linting + formatting) ───────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit security
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez (timezone-aware datetimes)
    "T20", # flake8-print (no bare prints in prod code)
    "RUF", # Ruff-specific
]
ignore = [
    "S101",  # Use of `assert` allowed in tests
    "B008",  # Do not perform function calls in default arguments (FastAPI deps)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "T20"]  # relax security rules in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── Mypy ──────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_any_generics = false
warn_return_any = false
plugins = ["pydantic.mypy"]

# ── Pytest ────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
timeout = 30
addopts = [
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=85",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ── Coverage ──────────────────────────────────────────────
[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/alembic/*",
    "backend/cache/*",
    "backend/logging_config.py",
    "*/__init__.py",
]



[tool.coverage.report]
show_missing = true
skip_covered = false
