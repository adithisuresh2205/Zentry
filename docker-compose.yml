# ─────────────────────────────────────────────────────────────────────────────
# SentinelGate / Zentry — Docker Compose (One-Command Production Setup)
# Usage: docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

name: sentinelgate

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelgate_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelgate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelgate} -d ${POSTGRES_DB:-sentinelgate}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    expose:
      - "5432"

  # ── Redis Cache & Token Revocation ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-sentinelgate_redis_pass_2026}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sentinelgate_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    expose:
      - "6379"

  # ── Backend (FastAPI Zero-Trust Gateway) ─────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinelgate}:${POSTGRES_PASSWORD:-sentinelgate_secure_pass_2026}@db:5432/${POSTGRES_DB:-sentinelgate}
      REDIS_URL: redis://:${REDIS_PASSWORD:-sentinelgate_redis_pass_2026}@redis:6379/0
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-42d017935d58e0ddac25c79a33e47be720abf44bcd34126e7521e8af7204d18a}
      JWT_ALGORITHM: HS256
      WAF_ENABLED: "true"
      WAF_BLOCK_THREATS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal
    command: ["sh", "-c", "(alembic upgrade head || true) && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips '*'"]

  # ── Frontend (Next.js Dashboard) ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  # ── Nginx (Edge Proxy & TLS Termination) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
